apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-services-ingress
  namespace: demo-namespace
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: demo.demo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-services
                port:
                  number: 80
