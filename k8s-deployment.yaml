apiVersion: apps/v1
kind: Deployment
metadata:
  name: firstdemoproject
  labels:
    app: firstdemoproject
spec:
  replicas: 3
  selector:
    matchLabels:
      app: firstdemoproject
  template:
    metadata:
      labels:
        app: firstdemoproject
    spec:
      serviceAccountName: first-demo-sa
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: firstdemoproject
          image: ghcr.io/uqurtosun/firstdemoproject:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: app-config
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"