apiVersion: apps/v1
kind: Deployment
metadata:
  name: firstdemoproject
  labels:
    app: firstdemoproject
spec:
  replicas: 2
  selector:
    matchLabels:
      app: firstdemoproject
  template:
    metadata:
      labels:
        app: firstdemoproject
    spec:
      containers:
      - name: firstdemoproject
        image: firstdemoproject:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

